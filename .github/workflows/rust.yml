name: Rust Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libclang-dev cmake build-essential pkg-config libssl-dev librocksdb-dev

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build
      run: |
        export LIBCLANG_PATH=$(find /usr/lib -name "libclang.so*" -exec dirname {} \; | head -n 1)
        echo "Using LIBCLANG_PATH: $LIBCLANG_PATH"
        cargo build --release --verbose
