<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0055ff"/>
      <stop offset="50%" stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#0055ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="silverShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="#070d17"/>
  <rect x="40" y="40" width="720" height="720" rx="40" ry="40" fill="none" stroke="url(#blueGlow)" stroke-width="12" filter="url(#glow)"/>
  <rect x="40" y="40" width="720" height="720" rx="40" ry="40" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  <g filter="url(#silverShadow)">
    <path d="M 400 180 L 260 550 L 340 550 L 400 400 L 460 550 L 540 550 Z" fill="url(#silver)"/>
    <path d="M 400 330 L 370 400 L 430 400 Z" fill="#070d17"/>
    <rect x="340" y="420" width="120" height="20" fill="url(#silver)"/>
  </g>
  <text x="400" y="680" font-family="Arial, sans-serif" font-size="100" font-weight="bold" letter-spacing="15" text-anchor="middle" fill="url(#silver)" filter="url(#silverShadow)">ACCUM</text>
  <text x="400" y="730" font-family="Arial, sans-serif" font-size="20" letter-spacing="8" text-anchor="middle" fill="#27aaff">FAIR PROOF OF CONTRIBUTION</text>
</svg>
