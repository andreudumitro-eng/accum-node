<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACCUM — Node Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#070d17;--panel:#0e1725;--line:#243247;--muted:#9aa9bd;--text:#edf4ff;--blue:#168cff;--green:#20dc72;--yellow:#f5bd26;--red:#ff4d5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,sans-serif}
.app{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr)}
.sidebar{border-right:1px solid var(--line);padding:22px 15px;display:flex;flex-direction:column;background:#08111e}
.brand{display:flex;gap:10px;align-items:center;padding:0 7px 22px;border-bottom:1px solid var(--line)}
.brand strong{font-size:21px;letter-spacing:1px;display:block}
.brand small{display:block;font-size:10px;letter-spacing:2px;color:#b7c4d5}
.nav{display:grid;gap:6px;margin-top:20px}
.nav a{padding:11px 12px;border-radius:8px;text-decoration:none;color:#d6e0ed;display:flex;gap:12px;align-items:center}
.nav a.active,.nav a:hover{background:#0c2c58;color:white}
.wallet-btn{margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;background:#0d5933;border:1px solid #126b3d;border-radius:8px;color:white;text-decoration:none;font-weight:600;font-size:14px}
.wallet-btn:hover{background:#126b3d}
main{min-width:0;padding:20px 24px 15px;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding:0 0 18px;margin-bottom:20px;flex-shrink:0}
.topbar h1{font-size:22px;margin:0 0 2px}
.status-pill{border:1px solid var(--line);border-radius:7px;padding:10px 13px;background:#0c1523;min-width:145px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:8px}
.panel{border:1px solid var(--line);border-radius:10px;background:linear-gradient(145deg,rgba(17,27,42,.96),rgba(10,18,31,.97));padding:16px;display:flex;flex-direction:column;min-height:0}
.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px;flex-shrink:0}
.panel h2{font-size:13px;margin:0;font-weight:750}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;flex-shrink:0}
.metric{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #1e2b3d}
.metric:last-child{border:0}
.tag{border:1px solid #126c42;color:var(--green);border-radius:6px;padding:3px 10px;background:#08291d;font-size:12px}
.tag.red{border-color:#7e2837;color:#ff7783;background:#431c27}
.logs-panel{flex:1;display:flex;flex-direction:column;min-height:0;margin-bottom:0}
.log-output{flex:1;overflow-y:auto;background:#070e19;border:1px solid #1d2b3d;border-radius:7px;padding:12px;font:12px ui-monospace,monospace;color:#a0b0c4;word-break:break-all}
.log-line{padding:2px 0;border-bottom:1px solid #1d2b3d}
.log-line:last-child{border-bottom:none}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div><strong>ACCUM</strong><small>FAIR MINING</small></div></div>
  <nav class="nav">
    <a class="active" href="#"><span>⌂</span>Dashboard</a>
  </nav>
  <a href="#" class="wallet-btn"><span>💼</span>Open Wallet</a>
</aside>
<main>
<header class="topbar">
  <div><h1>Dashboard</h1><div style="color:var(--muted)">Overview of your ACCUM node</div></div>
  <div><div class="status-pill"><span class="dot" id="statusDot"></span><strong id="topStatus">Connecting</strong><div style="color:var(--muted);font-size:11px" id="heightTop">Waiting...</div></div></div>
</header>

<section class="grid">
 <article class="panel">
  <div class="panel-head"><h2>⚒ MINING STATUS</h2><span class="tag" id="miningTag">RUNNING</span></div>
  <div class="metric"><span>Height</span><strong id="height">—</strong></div>
  <div class="metric"><span>Hashrate</span><strong id="hashrate">—</strong></div>
  <div class="metric"><span>Difficulty</span><strong id="difficulty">—</strong></div>
 </article>
 <article class="panel">
  <div class="panel-head"><h2>🛡 ATTACK MONITOR</h2><span class="tag" id="atk-tag">CLEAN</span></div>
  <div class="metric"><span>Detected</span><strong id="atk-detected">no</strong></div>
  <div class="metric"><span>Sybil Score</span><strong id="atk-sybil">—</strong></div>
  <div class="metric"><span>Peers</span><strong id="atk-peers">—</strong></div>
 </article>
 <article class="panel">
  <div class="panel-head"><h2>◎ NETWORK</h2></div>
  <div class="metric"><span>Peers</span><strong id="peers">—</strong></div>
  <div class="metric"><span>Sync status</span><strong id="sync">—</strong></div>
  <div class="metric"><span>Mempool</span><strong id="mempool">—</strong></div>
 </article>
</section>

<section class="panel logs-panel">
 <div class="panel-head">
   <h2>NODE LOGS</h2>
   <button class="btn" onclick="document.getElementById('logOutput').innerHTML=''">Clear</button>
 </div>
 <div class="log-output" id="logOutput"><div style="color:#71839a;text-align:center;padding:20px">Waiting for logs...</div></div>
</section>

</main>
</div>

<script>
const $ = id => document.getElementById(id);
async function fetchData(url) { const r = await fetch(url); if(!r.ok) throw new Error(); return r.json(); }

async function refresh() {
  try {
    const info = await fetchData('/info');
    statusDot.style.background = 'var(--green)';
    topStatus.textContent = 'Online';
    heightTop.textContent = 'Height ' + info.height;
    height.textContent = info.height;
    hashrate.textContent = (info.hash_rate || 0) + ' H/s';
    difficulty.textContent = info.difficulty?.toFixed(4) || '—';
    peers.textContent = info.peers || 0;
    sync.textContent = info.sync_progress >= 0.99 ? 'Synced' : 'Syncing';
    mempool.textContent = info.mempool_size || 0;

    const atk = await fetchData('/attacks');
    atk-tag.textContent = atk.attack_detected ? 'ATTACK' : 'CLEAN';
    atk-tag.className = 'tag ' + (atk.attack_detected ? 'red' : '');
    atk-detected.textContent = atk.attack_detected ? 'YES' : 'no';
    atk-detected.style.color = atk.attack_detected ? 'var(--red)' : 'var(--green)';
    atk-sybil.textContent = ((atk.sybil_score || 0) * 100).toFixed(1) + '%';
    atk-peers.textContent = atk.peers + ' / ' + atk.known_peers;

    const logsData = await fetchData('/logs');
    const container = logOutput;
    const logs = logsData.logs || [];
    if (logs.length > 0) {
      const lastLog = logs[logs.length - 1];
      if (container.dataset.last !== lastLog) {
        container.dataset.last = lastLog;
        container.innerHTML = logs.slice(-50).map(line => {
          let color = '#a0b0c4';
          if (line.includes('BLOCK')) color = '#20dc72';
          if (line.includes('SHARE-SEND')) color = '#168cff';
          if (line.includes('SHARE-RECV')) color = '#f5bd26';
          if (line.includes('Invalid')) color = '#ff4d5c';
          return <div class="log-line" style="color:"></div>;
        }).join('');
        container.scrollTop = container.scrollHeight;
      }
    }
  } catch(e) { console.error(e); }
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
