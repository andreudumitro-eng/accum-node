[package]
name = "accum-node"
version = "3.2.0"
edition = "2021"
license = "MIT"
authors = ["Andrii Dumitro <andreudumitro@gmail.com>"]
description = "ACCUM: Fair Proof-of-Contribution Blockchain Node (ASIC-resistant, CPU-friendly)"
repository = "https://github.com/andreudumitro-eng/accum-core"
readme = "README.md"
keywords = ["blockchain", "consensus", "pow", "argon2id", "cryptocurrency"]
categories = ["cryptography", "network-programming"]

[dependencies]
# Криптография
sha2 = "0.10"
ripemd = "0.1"
hex = "0.4"
secp256k1 = { version = "0.28", features = ["rand", "serde"] }
argon2 = "0.5"
reqwest = { version = "0.11", features = ["blocking", "json"] }

# Сериализация
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# База данных
rocksdb = "0.21"

# Сеть
warp = "0.3"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
rand = "0.8"

# Утилиты
lazy_static = "1.4"
dirs = "5.0"
chrono = "0.4"
bs58 = "0.5"
hex-literal = "0.4"

# Системные зависимости
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0